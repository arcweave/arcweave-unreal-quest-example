name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-script-routing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build-script routing without Unreal
        shell: powershell
        run: ./Scripts/test-build.ps1
